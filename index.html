<!doctype html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BARAN REKANI | Driving School</title>
  <style>
    :root{--navy:#10243f;--blue:#1769aa;--gold:#f5b942;--paper:#fffdf7;--ink:#122033;--muted:#667085;--ok:#0a855d;--bad:#c53838}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eaf4ff,#f9fbff 55%,#fff5d9)}header{background:var(--navy);color:#fff;padding:16px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 3px 12px #10243f33}.brand{display:flex;gap:12px;align-items:center}.badge{background:var(--gold);color:#10243f;font-size:22px;font-weight:900;border-radius:50%;width:46px;height:46px;display:grid;place-items:center}.brand h1{font-size:16px;margin:0;letter-spacing:.5px}.brand small{color:#d6e6f7}.lang{border:1px solid #ffffff77;color:white;background:transparent;border-radius:8px;padding:8px 10px;font-weight:bold}main{max-width:760px;margin:35px auto;padding:0 18px}.card{background:var(--paper);border-radius:18px;padding:clamp(22px,5vw,42px);box-shadow:0 16px 36px #10243f1c;border:1px solid #dbe8f4}.screen{display:none}.screen.active{display:block}.hero{text-align:center}.hero .sign{font-size:70px}.hero h2{margin:8px 0;font-size:28px;color:var(--navy)}.hero p{color:var(--muted);line-height:1.8}.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:25px 0;text-align:right}.rule{background:#eef7ff;padding:12px;border-radius:10px;color:#294b70}.primary{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:14px 26px;font-size:16px;font-weight:bold;cursor:pointer}.primary:hover{background:#10568f}.quiz-meta{display:flex;justify-content:space-between;gap:12px;color:#41566f;font-weight:bold;border-bottom:1px solid #e4e9ef;padding-bottom:16px}.timer{color:var(--bad)}.progress{height:8px;background:#e4ebf2;border-radius:10px;margin:18px 0}.progress b{display:block;height:100%;background:var(--gold);border-radius:10px;transition:width .25s}h2.question{font-size:23px;line-height:1.7;margin:24px 0}.options{display:grid;gap:12px}.option{width:100%;border:2px solid #d9e4ef;background:white;border-radius:12px;padding:15px;text-align:right;font:inherit;font-size:16px;cursor:pointer;transition:.15s}.option:hover{border-color:var(--blue);background:#f4faff}.option.correct{border-color:var(--ok);background:#eafaf4}.option.wrong{border-color:var(--bad);background:#fff0f0}.option:disabled{cursor:default}.result{text-align:center}.score{font-size:64px;font-weight:900;color:var(--blue);margin:10px}.pass{color:var(--ok)}.fail{color:var(--bad)}.review{text-align:right;margin-top:26px;border-top:1px solid #e4e9ef;padding-top:18px}.review div{padding:8px;border-bottom:1px solid #eef1f4}.rtl{direction:rtl}.ltr{direction:ltr}@media(max-width:520px){.rules{grid-template-columns:1fr}.brand h1{font-size:13px}main{margin:20px auto}.card{padding:22px 18px}}
  </style>
</head>
<body><header><div class="brand"><div class="badge">BR</div><div><h1>BARAN REKANI DRIVING SCHOOL</h1><small id="subtitle">تاقیکردنەوەی یاسای هاتووچۆ</small></div></div><select class="lang" id="language" aria-label="Language"><option value="ku">کوردی</option><option value="ar">العربية</option><option value="en">English</option></select></header>
<main><section class="card"><div id="welcome" class="screen active hero"><div class="sign">🚗</div><h2 id="welcomeTitle"></h2><p id="welcomeText"></p><div class="rules" id="rules"></div><button class="primary" id="start"></button></div><div id="quiz" class="screen"><div class="quiz-meta"><span id="counter"></span><span class="timer">⏱ <span id="time">60</span>s</span></div><div class="progress"><b id="bar"></b></div><h2 class="question" id="question"></h2><div class="options" id="options"></div></div><div id="results" class="screen result"><div class="sign">🏁</div><h2 id="resultTitle"></h2><div class="score" id="score"></div><p id="resultText"></p><button class="primary" id="restart"></button><div class="review" id="review"></div></div></section></main>
<script>
const TEXT={ku:{title:'تاقیکردنەوەی شوفێری',intro:'پێش دەستپێکردن، یاساکان بخوێنەوە و بە ئارامی وەڵام بدەوە.',start:'دەستپێکردنی تاقیکردنەوە',q:'پرسیار',time:'چرکە',points:'٥ خاڵ بۆ هەر وەڵامێکی دروست',total:'٢٠ پرسیار — کۆی گشتی ١٠٠ خاڵ',pass:'دەرچوون لە ٨٥ خاڵ و زیاتر',timer:'٦٠ چرکە بۆ هەر پرسیار',passed:'پیرۆزە، دەرچوویت!',failed:'ببورە، دەرنەچوویت',again:'دووبارە تاقی بکەرەوە',outof:'لە ١٠٠',detail:'وردەکاری وەڵامەکان'},ar:{title:'اختبار مدرسة باران ريكاني للقيادة',intro:'اقرأ التعليمات وأجب بهدوء قبل البدء.',start:'ابدأ الاختبار',q:'السؤال',time:'ثانية',points:'٥ نقاط لكل إجابة صحيحة',total:'٢٠ سؤالاً — المجموع ١٠٠ نقطة',pass:'النجاح من ٨٥ نقطة فأعلى',timer:'٦٠ ثانية لكل سؤال',passed:'مبروك، لقد نجحت!',failed:'عذراً، لم تنجح',again:'إعادة الاختبار',outof:'من ١٠٠',detail:'مراجعة الإجابات'},en:{title:'Baran Rekani Driving School Test',intro:'Read the rules and answer each question carefully.',start:'Start the test',q:'Question',time:'seconds',points:'5 points for every correct answer',total:'20 questions — score out of 100',pass:'Pass with 85 points or more',timer:'60 seconds for each question',passed:'Congratulations, you passed!',failed:'Sorry, you did not pass',again:'Try again',outof:'out of 100',detail:'Answer review'}};
// Correct answers are intentionally balanced: option 1 = 7, option 2 = 7, option 3 = 6.
const QUESTIONS=[
{a:0,t:{ku:'کاتێک چرای سوور دەبینیت چی دەکەیت؟',ar:'ماذا تفعل عند رؤية الإشارة الحمراء؟',en:'What do you do at a red traffic light?'},o:{ku:['دەوەستیت','بە خێرایی دەڕۆیت','تەنها خێرایی کەم دەکەیت'],ar:['تتوقف','تسرع','تخفف السرعة فقط'],en:['Stop','Speed up','Only slow down']}},
{a:1,t:{ku:'پێش گۆڕینی ئاراستە چی بکەیت؟',ar:'ماذا تفعل قبل تغيير المسار؟',en:'What should you do before changing lanes?'},o:{ku:['تەنها فرمان بگۆڕە','ئاوێنە و چرای ئاگادارکردنەوە بپشکنە','بێ سەیرکردن بڕۆ'],ar:['غير الاتجاه فقط','افحص المرايا واستعمل الإشارة','انتقل دون نظر'],en:['Just steer over','Check mirrors and use signal','Move without looking']}},
{a:2,t:{ku:'نیشانەی سێگۆشەی سوور بە مانای چییە؟',ar:'ماذا تعني العلامة المثلثة ذات الحافة الحمراء؟',en:'What does a red-bordered triangle sign mean?'},o:{ku:['ڕێگای یەک ئاراستە','وەستانی تەواو','ئاگاداری/مەترسی'],ar:['طريق باتجاه واحد','توقف تام','تحذير أو خطر'],en:['One-way road','Full stop','Warning or hazard']}},
{a:0,t:{ku:'لە کاتی باراندا پێویستە چی بکەیت؟',ar:'ماذا يجب أن تفعل عند القيادة في المطر؟',en:'What should you do when driving in rain?'},o:{ku:['خێرایی کەم بکەیت و دووری زیاد بکەیت','نزیک بڕۆیتەوە لە ئۆتۆمبێلی پێشەوە','چرای پێشەوە کوژێنیتەوە'],ar:['تخفف السرعة وتزيد مسافة الأمان','تقترب من السيارة أمامك','تطفئ المصابيح'],en:['Slow down and increase distance','Drive closer to the car ahead','Turn off headlights']}},
{a:1,t:{ku:'کاتی زەنگدانی مۆبایل لە کاتی شوفێری؟',ar:'ما التصرف الصحيح عند رنين الهاتف أثناء القيادة؟',en:'What is the safe action when your phone rings while driving?'},o:{ku:['وەڵام بدەیت بە دەست','بکوژێنیتەوە یان لە شوێنێکی سەلامەت بوەستیت','نامە بنووسیت'],ar:['ترد بيدك','تتجاهله أو تتوقف بمكان آمن','ترسل رسالة'],en:['Answer by hand','Ignore it or stop safely','Send a text']}},
{a:2,t:{ku:'کاتێک پیاوڕێ دەخاتە سەر پەڕینگە؟',ar:'عندما يكون المشاة على ممر العبور؟',en:'When pedestrians are on a crossing?'},o:{ku:['دەبێت بیدەرپەڕێنیت','دەبێت هۆرن لێبدەیت','دەبێت وەستیت و ڕێیان بدەیت'],ar:['تتجاوزهم','تطلق البوق','تتوقف وتمنحهم الأولوية'],en:['Drive through','Honk','Stop and give way']}},
{a:0,t:{ku:'بەکارهێنانی کمێربەندی سەلامەتی؟',ar:'استخدام حزام الأمان؟',en:'Using a seat belt?'},o:{ku:['پێویستە بۆ هەموو دانیشتووان','تەنها بۆ شوفێرە','لە شاردا پێویست نییە'],ar:['واجب على جميع الركاب','للسائق فقط','غير لازم داخل المدينة'],en:['Required for all occupants','Only for driver','Not needed in town']}},
{a:1,t:{ku:'لە کاتی گەڕانەوە (reverse) چی بکەیت؟',ar:'ماذا تفعل عند الرجوع للخلف؟',en:'What should you do when reversing?'},o:{ku:['تەنها بە ئاوێنە سەیر بکە','دەوروبەر بپشکنە و بە هێواشی بڕۆ','بە خێرایی بڕۆ'],ar:['تنظر للمرايا فقط','تتحقق من محيطك وتتحرك ببطء','تسرع'],en:['Only look in mirrors','Check surroundings and move slowly','Reverse quickly']}},
{a:2,t:{ku:'هێڵی سپی بەردەوام لە ڕێگا چی دەڵێت؟',ar:'ماذا يعني الخط الأبيض المتصل؟',en:'What does a solid white line mean?'},o:{ku:['هەرکات دەتوانیت تێپەڕیت','شوێنی وەستانە','مەهێڵە بە ئاسانی بگۆڕیتە ئەو لا'],ar:['يمكن تجاوزه دائماً','مكان توقف','لا تعبره أو تغيّر المسار بسهولة'],en:['Always cross it','Parking area','Do not cross/change lanes casually']}},
{a:0,t:{ku:'پێش چوونە ناو بازنە (roundabout)؟',ar:'قبل دخول الدوار؟',en:'Before entering a roundabout?'},o:{ku:['ڕێ بدە بە ئۆتۆمبێلەکانی ناو بازنە','ڕاستەوخۆ بچۆ ناوەوە','تەنها هۆرن لێبدە'],ar:['أعط الأولوية لمن داخل الدوار','ادخل فوراً','أطلق البوق فقط'],en:['Give way to vehicles in it','Enter immediately','Only honk']}},
{a:1,t:{ku:'ئەم نیشانەیە «STOP» چییە؟',ar:'ماذا تعني علامة STOP؟',en:'What does a STOP sign require?'},o:{ku:['تەنها خێرایی کەم بکە','وەستانی تەواو','تەنها لە شەودا بوەستە'],ar:['خفف السرعة فقط','توقف تماماً','توقف ليلاً فقط'],en:['Only slow down','Come to a complete stop','Stop only at night']}},
{a:2,t:{ku:'دووری سەلامەت لە ئۆتۆمبێلی پێشەوە؟',ar:'كيف تحافظ على مسافة آمنة؟',en:'How do you keep a safe following distance?'},o:{ku:['بە هەمان خێرایی نزیک دەبیتەوە','تەنها لە ڕێگای خاوێندا','بەپێی خێرایی و کەشوهەوا دووری گونجاو بپارێزە'],ar:['تقترب بنفس السرعة','فقط في طريق جاف','تترك مسافة مناسبة حسب السرعة والطقس'],en:['Stay close at same speed','Only on dry roads','Leave suitable distance for speed/weather']}},
{a:0,t:{ku:'کاتێک فریاکەوتن نزیک دەبێتەوە؟',ar:'عند اقتراب سيارة إسعاف؟',en:'When an ambulance approaches?'},o:{ku:['بە سەلامەتی لای ڕێگا بچۆ و ڕێ بدە','خێرایی زیاد بکە','لە پێشیدا بڕۆ'],ar:['انتقل بأمان للجانب وأفسح الطريق','زد السرعة','قد أمامها'],en:['Move safely aside and yield','Speed up','Drive in front']}},
{a:1,t:{ku:'کاتێک ماندوو یان خەوتوو بیت؟',ar:'ماذا تفعل عند الشعور بالنعاس؟',en:'What should you do when sleepy?'},o:{ku:['پەنجەرە بکەرەوە و بەردەوام بە','لە شوێنێکی سەلامەت بوەستە و پشوودە','خێرایی زیاد بکە'],ar:['افتح النافذة واستمر','توقف في مكان آمن وخذ راحة','زد السرعة'],en:['Open window and continue','Stop safely and rest','Drive faster']}},
{a:2,t:{ku:'لە نزیکی قوتابخانەدا؟',ar:'عند الاقتراب من مدرسة؟',en:'Near a school?'},o:{ku:['دەنگی هۆرن زیاد بکە','بەخێرایی تێپەڕە','خێرایی کەم بکە و ئاگادار بە'],ar:['أطلق البوق بقوة','مر بسرعة','خفف السرعة وانتبه'],en:['Honk loudly','Pass quickly','Slow down and stay alert']}},
{a:0,t:{ku:'چرای زەردی هاتووچۆ؟',ar:'ماذا تعني الإشارة الصفراء؟',en:'What does a yellow traffic light mean?'},o:{ku:['ئامادەی وەستان بە، ئەگەر بە سەلامەتی بتوانیت','دەبێت خێرایی زیاد بکەیت','مانای ڕێگەپێدانە'],ar:['استعد للتوقف إن كان آمناً','يجب أن تسرع','تعني اذهب'],en:['Prepare to stop if safe','You must accelerate','It means go']}},
{a:1,t:{ku:'لە کاتی تێپەڕین لە ئۆتۆمبێلێکی تر؟',ar:'عند تجاوز مركبة أخرى؟',en:'When overtaking another vehicle?'},o:{ku:['لە چەپ و ڕاست تێپەڕە','تەنها لە شوێنی ڕێگەپێدراو و بە بینینی ڕوون','لە شوێنی هێڵی بەردەوام'],ar:['تجاوز من أي جهة','فقط عندما يكون مسموحاً والرؤية واضحة','عند الخط المتصل'],en:['Pass from either side','Only where allowed with clear view','At a solid line']}},
{a:2,t:{ku:'کاتێک تایەکان کەم هەوا بن؟',ar:'عندما يكون ضغط الإطارات منخفضاً؟',en:'When tire pressure is low?'},o:{ku:['بەردەوام بە بێ پشکنین','خێرایی زیاد بکە','فشاریان بپشکنە و ڕێکبخە'],ar:['استمر دون فحص','زد السرعة','افحص الضغط واضبطه'],en:['Continue without checking','Speed up','Check and adjust it']}},
{a:0,t:{ku:'پێش گەشتی درێژ؟',ar:'قبل رحلة طويلة؟',en:'Before a long journey?'},o:{ku:['بریک، تایەر و سووتەمەنی بپشکنە','تەنها ڕادیۆ بپشکنە','هیچ پشکنینێک مەکە'],ar:['افحص المكابح والإطارات والوقود','افحص الراديو فقط','لا تفحص شيئاً'],en:['Check brakes, tires and fuel','Only check radio','Do no checks']}},
{a:1,t:{ku:'ئایا مەیخواردن و شوفێری؟',ar:'هل يجوز القيادة بعد شرب الكحول؟',en:'Can you drive after drinking alcohol?'},o:{ku:['بەڵێ، ئەگەر ڕێگا بەتاڵ بێت','نەخێر، مەیخواردن شوفێری مەکە','بەڵێ، تەنها لە شەودا'],ar:['نعم إذا كان الطريق فارغاً','لا، لا تقد بعد شرب الكحول','نعم ليلاً فقط'],en:['Yes if road is empty','No, never drive after drinking','Yes only at night']}}
];
const POINTS_PER_QUESTION = 5, PASS_MARK = 85, QUESTION_SECONDS = 60;
if (QUESTIONS.length !== 20) throw new Error('Quiz must contain exactly 20 questions');
let lang='ku', current=0, score=0, answers=[], seconds=QUESTION_SECONDS, interval;
const $=id=>document.getElementById(id);function tx(){return TEXT[lang]}function renderWelcome(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.body.className=lang==='en'?'ltr':'rtl';$('subtitle').textContent=lang==='ku'?'تاقیکردنەوەی یاسای هاتووچۆ':lang==='ar'?'اختبار قوانين المرور':'Traffic rules test';$('welcomeTitle').textContent=tx().title;$('welcomeText').textContent=tx().intro;$('start').textContent=tx().start;$('rules').innerHTML=[tx().total,tx().points,tx().pass,tx().timer].map(x=>`<div class="rule">✓ ${x}</div>`).join('')}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function start(){current=0;score=0;answers=[];show('quiz');renderQuestion()}function renderQuestion(){clearInterval(interval);seconds=QUESTION_SECONDS;const q=QUESTIONS[current];$('counter').textContent=`${tx().q} ${current+1} / 20`;$('question').textContent=q.t[lang];$('bar').style.width=`${(current/20)*100}%`;$('time').textContent=seconds;$('options').innerHTML=q.o[lang].map((option,i)=>`<button class="option" data-index="${i}"><b>${i+1}.</b> ${option}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>select(+b.dataset.index));interval=setInterval(()=>{seconds--; $('time').textContent=seconds;if(seconds<=0){clearInterval(interval);answers.push({selected:null,correct:q.a});nextQuestion()}},1000)}function select(selected){clearInterval(interval);const q=QUESTIONS[current],buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add('correct');if(selected!==q.a)buttons[selected].classList.add('wrong');else score+=POINTS_PER_QUESTION;answers.push({selected,correct:q.a});setTimeout(nextQuestion, 450)}function nextQuestion(){current++;if(current<20)renderQuestion();else results()}function results(){clearInterval(interval);show('results');const passed=score>=PASS_MARK;$('resultTitle').textContent=passed?tx().passed:tx().failed;$('resultTitle').className=passed?'pass':'fail';$('score').textContent=`${score} / 100`;$('resultText').textContent=passed?tx().pass:tx().pass;$('restart').textContent=tx().again;$('review').innerHTML=`<h3>${tx().detail}</h3>`+answers.map((a,i)=>`<div>${tx().q} ${i+1}: ${a.selected===a.correct?'✓':'✗'} &nbsp; ${QUESTIONS[i].o[lang][a.correct]}</div>`).join('')}$('language').onchange=e=>{lang=e.target.value;renderWelcome()};$('start').onclick=start;$('restart').onclick=start;renderWelcome();
</script></body></html>
